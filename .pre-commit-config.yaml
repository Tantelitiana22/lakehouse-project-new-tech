# Pre-commit hooks.
#
# Install once with `pre-commit install`, then hooks run on `git commit`.
# Run the whole suite against every file with `pre-commit run --all-files`.
#
# Line length is 120 everywhere: black, isort, flake8, pylint, ruff and the
# SQLFluff settings read by `dbt lint` are all pinned to the same value so they
# cannot fight each other.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      # Configured entirely in [tool.isort] in pyproject.toml (profile, line
      # length and known_first_party), so no CLI flags are needed here.
      - id: isort

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=120]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        # flake8 defaults to 79 columns and is not configured anywhere, which
        # would flag 242 lines. Delegate the limit to .flake8 instead.
        args: [--config=.flake8]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        # `requests` and `croniter` are stubs for packages this project does
        # not import at all, so they are not listed here. `types-PyYAML` is,
        # because `import yaml` appears in the codebase.
        additional_dependencies:
          - types-PyYAML
          - pydantic
        # Settings (python_version, ignore_missing_imports) live in
        # [tool.mypy] in pyproject.toml, so only the config path is passed.
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.7
    hooks:
      - id: pylint
        # pylint resolves imports from the environment it runs in. Without the
        # project's own dependencies it reports 22 spurious `import-error`s and
        # cannot see the packages at all. dagster and pyspark live in optional
        # extras, so they have to be listed explicitly rather than pulled from
        # the base dependencies.
        additional_dependencies:
          - pydantic>=2.8.0,<3
          - PyYAML>=6.0.1,<7
          - boto3>=1.34.0,<2
          - httpx>=0.27.0,<1
          - dagster>=1.9.0,<2
        args:
          - --rcfile=.pylintrc
          - --ignore-paths=^orchestration/ingestion/tests/
        exclude: ^orchestration/ingestion/tests/

  # dbt v2 ships its own SQL linter (`dbt lint`) and formatter (`dbt format`),
  # both driven by the SQLFluff rules and the `.sqlfluff` file at the repo root.
  # They replace the standalone sqlfluff 3.x hooks, which could not template
  # `ref()`/`source()` without the Jinja templater and were an order of
  # magnitude slower.
  #
  # Both hooks are `language: system` because dbt is an optional extra of this
  # project (`uv sync --extra dbt`), not a tool pre-commit can install in its
  # own isolated environment: the binary needs the project's profiles.yml.
  #
  # `env DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true` is not decoration: the Spark
  # adapter is compiled into the dbt v2 binary but still gated, and without the
  # variable every command fails with `dbt1005` before parsing anything.
  - repo: local
    hooks:
      - id: dbt-format
        name: dbt format (check)
        language: system
        entry: env DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true dbt format --check
        args:
          - --project-dir=dbt_lakehouse
          - --profiles-dir=dbt_lakehouse
        files: ^dbt_lakehouse/.*\.sql$
        pass_filenames: false
        require_serial: true

      - id: dbt-lint
        name: dbt lint
        language: system
        # `dbt lint --fix` always exits 0, so it cannot gate a commit on its
        # own. Run the plain linter: it exits 1 when a violation remains, and
        # the violations it reports are all auto-fixable by `dbt lint --fix`.
        entry: env DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true dbt lint
        args:
          - --project-dir=dbt_lakehouse
          - --profiles-dir=dbt_lakehouse
        files: ^dbt_lakehouse/.*\.sql$
        pass_filenames: false
        require_serial: true
