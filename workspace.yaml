# ``working_directory`` resolves against the *process* cwd, not against this
# file: Dagster does not rebase it for ``python_module`` targets the way it does
# for ``python_file``. Every supported entrypoint therefore starts in the repo
# root -- the container sets WORKDIR /app, and ``make dagster-dev`` runs from
# here -- so "." is correct. In the container PYTHONPATH=/app already makes the
# module importable; the key is kept so a bare ``dagster dev`` also works.
load_from:
  - python_module:
      module_name: use_case
      working_directory: .
