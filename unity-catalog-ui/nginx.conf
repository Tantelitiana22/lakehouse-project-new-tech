# Rendered by the nginx image's entrypoint via envsubst, which substitutes
# ${UC_SERVER} and ${NGINX_PORT} from the container environment at startup.
server {
    listen       ${NGINX_PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The UI uses client-side routing (react-router), so any unknown path has to
    # return index.html rather than a 404 -- otherwise a reload on a deep link
    # like /data/unity/default breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Unity Catalog REST API. The client's axios baseURL is relative
    # (`/api/2.1/unity-catalog`), so proxying here keeps the browser
    # same-origin and removes any need for CORS on the Unity Catalog server.
    location /api/ {
        proxy_pass         ${UC_SERVER};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Table and volume listings can be large; do not spool them to disk.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # Same-origin passthrough for the optional IdP flows (token exchange, SCIM
    # "who am I"). Harmless when auth is disabled.
    location /auth/ {
        proxy_pass       ${UC_SERVER};
        proxy_set_header Host $host;
    }

    location /scim2/ {
        proxy_pass       ${UC_SERVER};
        proxy_set_header Host $host;
    }

    # CRA emits content-hashed filenames, so these are safe to cache for good.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a redeploy leaves clients pinned to
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
