[project]
name = "ndr-lakehouse"
version = "0.2.0"
description = "Metadata-driven Open Data Lakehouse: RustFS + Unity Catalog OSS + Iceberg + Dagster + dbt/MetricFlow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Data Platform Team" }]

dependencies = [
    "boto3>=1.34.0,<2",
    "dagster>=1.13.29,<2",
    "dagster-webserver>=1.13.9,<2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.8.0,<3",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
# PySpark is pinned at 4.1.1 rather than 4.3.x: Delta and Iceberg are the
# binding constraints, not Spark itself. ``delta-spark`` 4.3.1 requires
# ``pyspark<=4.1.1``, and Iceberg publishes no ``iceberg-spark-runtime`` for
# Spark 4.2 or 4.3 at all (only ``-4.0_2.13`` and ``-4.1_2.13``). Spark 4.1.1
# is the newest release the whole stack supports.
spark = ["pyspark>=4.1.1,<4.2", "delta-spark>=4.3.1,<4.4"]
# dbt v2 ships as `dbt` (not `dbt-core`, which stops at 1.12.6). The engine is a
# bundled binary that exposes no importable Python API, so `dagster-dbt` -- which
# imports dbt.adapters/dbt.config/dbt.flags -- cannot share a venv with it. Dagster
# therefore drives dbt through the CLI only (see ``orchestration/dbt_runner.py``).
# The Spark adapter is built into the binary and needs
# DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true; the Semantic Layer lives behind `dbt sl`,
# which replaces the v1-only `metricflow` / `dbt-metricflow` plugins.
dbt = ["dbt==2.0.11"]
postgres = ["dagster-postgres>=0.25.0,<1"]

[dependency-groups]
# ruff is listed so `make lint` / `make format` and CI resolve the same binary.
# It is not redundant with black/isort/flake8 in pre-commit: those hooks run in
# their own isolated venvs and are the ones that must pass before a commit, while
# ruff adds the pyupgrade (UP) and bugbear (B) rule sets the other three do not
# implement.
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.4",
]
# The same five tools pre-commit runs, at the *same pinned versions*. Without
# this group `uv run isort` and friends fail with "Failed to spawn" -- pre-commit
# installs each hook into its own throwaway venv, so nothing lands in .venv.
# Running them here instead keeps CI and `make lint` working from one sync, and
# pinning to the pre-commit `rev:` values means CI cannot demand a style the
# hooks would reject. Bump both files together.
lint = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "pylint==4.1.3",
    "types-PyYAML",
]

[tool.uv]
# uv installs only the `dev` group by default, so a plain `uv sync` would leave
# `lint` out and `uv run isort` would fail with "Failed to spawn". Listing both
# keeps `uv sync`, `make lint` and CI on the same environment.
default-groups = ["dev", "lint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestration/ingestion/src/ndr_lakehouse", "portal/src/lakehouse_portal"]

[tool.pytest.ini_options]
testpaths = ["orchestration/ingestion/tests/ndr_lakehouse", "portal/tests"]
pythonpath = ["orchestration/ingestion/src", "portal/src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ndr_lakehouse",
    "--cov=lakehouse_portal",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# ruff's import sorter is a second opinion on top of isort, and by default it
# resolves first-party packages from the filesystem. `orchestration/` is not a
# package (the importable root is `orchestration/ingestion/src`), so it cannot
# discover `ndr_lakehouse` or `use_case` and files them as third-party -- a
# different grouping from isort's. Declaring the same list as [tool.isort]
# makes the two agree instead of having CI disagree with `pre-commit`.
[tool.ruff.lint.isort]
known-first-party = ["lakehouse_portal", "ndr_lakehouse", "use_case"]

# isort reads this section directly, so the hook needs no CLI flags.
# `known_first_party` is the line that matters: without it isort treats
# `ndr_lakehouse` as third-party and deletes the blank line separating it from
# `dagster`, silently undoing the grouping the code already uses.
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["lakehouse_portal", "ndr_lakehouse", "use_case"]

# mypy is invoked by pre-commit with `--config-file=pyproject.toml`, so its
# settings must live here rather than in a separate mypy.ini.
[tool.mypy]
python_version = "3.11"
# Third-party libraries without stub packages (delta, dbt, dagster_dbt) would
# otherwise dominate the output with import errors that we cannot fix.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["ndr_lakehouse", "lakehouse_portal"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
