[project]
name = "ndr-lakehouse"
version = "0.2.0"
description = "Metadata-driven Open Data Lakehouse: RustFS + Unity Catalog OSS + Iceberg + Dagster + dbt/MetricFlow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Data Platform Team" }]

dependencies = [
    "boto3>=1.34.0,<2",
    "dagster>=1.9.0,<2",
    "dagster-dbt>=0.25.0,<1",
    "httpx>=0.27.0,<1",
    "pydantic>=2.8.0,<3",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0,<3.6",
    "delta-spark>=3.2.0,<3.3.0",
]
dbt = [
    "dbt-core>=1.11,<2",
    "dbt-spark[PyHive]>=1.8,<2",
    "dbt-metricflow>=0.15.0,<1",
    "metricflow>=0.213.0,<1",
]
postgres = [
    "dagster-postgres>=0.25.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestration/ingestion/src/ndr_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["orchestration/ingestion/tests/ndr_lakehouse"]
pythonpath = ["orchestration/ingestion/src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ndr_lakehouse",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# isort reads this section directly, so the hook needs no CLI flags.
# `known_first_party` is the line that matters: without it isort treats
# `ndr_lakehouse` as third-party and deletes the blank line separating it from
# `dagster`, silently undoing the grouping the code already uses.
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ndr_lakehouse", "use_case"]

# mypy is invoked by pre-commit with `--config-file=pyproject.toml`, so its
# settings must live here rather than in a separate mypy.ini.
[tool.mypy]
python_version = "3.11"
# Third-party libraries without stub packages (delta, dbt, dagster_dbt) would
# otherwise dominate the output with import errors that we cannot fix.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["ndr_lakehouse"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
