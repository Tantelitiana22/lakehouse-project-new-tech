<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Lakehouse Portal{% endblock %}</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 1.05rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    .nav { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .nav a { color: var(--muted); font-weight: 500; padding: 0.35rem 0.65rem; border-radius: 6px; }
    .nav a:hover, .nav a.active { color: var(--text); background: var(--surface-2); text-decoration: none; }
    .container { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.75rem; font-weight: 600; padding: 0.18rem 0.55rem; border-radius: 999px;
      background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
    }
    .badge.online { color: #86efac; border-color: #166534; background: #052e16; }
    .badge.offline { color: #fca5a5; border-color: #7f1d1d; background: #450a0a; }
    .badge.rw { color: #93c5fd; border-color: #1d4ed8; background: #172554; }
    .badge.ro { color: #fde68a; border-color: #92400e; background: #451a03; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.45rem 0.9rem; border-radius: 6px; border: 1px solid transparent;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #082f49;
    }
    .btn:hover { background: var(--accent-hover); text-decoration: none; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: #7f1d1d; color: #fecaca; border-color: #991b1b; }
    .btn-danger:hover { background: #991b1b; }
    .btn-sm { padding: 0.28rem 0.65rem; font-size: 0.8rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type="text"], input[type="password"], select, input[type="file"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.45rem 0.65rem; font-size: 0.875rem;
    }
    .alert {
      padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .alert-error { border-color: #991b1b; background: #450a0a; color: #fecaca; }
    .alert-success { border-color: #166534; background: #052e16; color: #bbf7d0; }
    pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.85rem; overflow-x: auto; font-size: 0.82rem; color: #e2e8f0;
    }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  {% if current_user %}
  <header class="topbar">
    <div class="row">
      <a class="brand" href="/">NDR Lakehouse Portal</a>
      <nav class="nav">
        <a href="/" class="{% if active_tab == 'launchpad' %}active{% endif %}">Launchpad</a>
        <a href="/buckets" class="{% if active_tab == 'buckets' %}active{% endif %}">Buckets</a>
        <a href="/keys" class="{% if active_tab == 'keys' %}active{% endif %}">S3 Keys</a>
        {% if current_user.is_admin %}
        <a href="/admin" class="{% if active_tab == 'admin' %}active{% endif %}">Admin</a>
        {% endif %}
      </nav>
    </div>
    <div class="row">
      <span class="badge">{{ current_user.username }}{% if current_user.is_admin %} (Admin){% endif %}</span>
      <form method="post" action="/logout" style="margin:0">
        <button type="submit" class="btn btn-secondary btn-sm">Sign out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
