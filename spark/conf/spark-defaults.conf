# Delta is the physical format; UniForm emits Iceberg metadata for the same data.
# Unity Catalog OSS remains available as a read-only Iceberg REST catalog.
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog=spark_catalog
spark.sql.catalog.lakehouse=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalog.lakehouse.warehouse=s3://lakehouse/warehouse
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

spark.sql.catalog.iceberg_rest=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_rest.type=rest
spark.sql.catalog.iceberg_rest.uri=http://unity-catalog:8080/api/2.1/unity-catalog/iceberg
spark.sql.catalog.iceberg_rest.warehouse=s3://lakehouse/warehouse
spark.sql.catalog.iceberg_rest.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg_rest.s3.endpoint=http://rustfs:9000
spark.sql.catalog.iceberg_rest.s3.path-style-access=true
spark.sql.catalog.iceberg_rest.s3.access-key-id=rustfsadmin
spark.sql.catalog.iceberg_rest.s3.secret-access-key=rustfssecret
spark.sql.catalog.iceberg_rest.s3.region=us-east-1

spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint=http://rustfs:9000
spark.hadoop.fs.s3a.access.key=rustfsadmin
spark.hadoop.fs.s3a.secret.key=rustfssecret
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

spark.sql.warehouse.dir=s3://lakehouse/warehouse
spark.hive.server2.thrift.bind.host=0.0.0.0
spark.hive.server2.thrift.port=10000
